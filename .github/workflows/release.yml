name: Release addon zip

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Stage release
        run: |
          set -euo pipefail

          mkdir -p "dist/tTimers"
          
          rsync -a --delete \
            --exclude ".git" \
            --exclude ".gitmodules" \
            --exclude ".github" \
            --exclude "dist" \
            ./ "dist/tTimers/"

          echo "Staged contents:"
          ls -la "dist/tTimers"

      - name: Zip it
        run: |
          set -euo pipefail
          cd dist
          ZIP_NAME="tTimers-${GITHUB_REF_NAME}.zip"
          zip -r "${ZIP_NAME}" "tTimers"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Create/Update GitHub Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.ZIP_NAME }}
          body: |
            ## Install
            Download `tTimers-${{ github.ref_name }}.zip` below. Do not use "Source code (zip)" because it does not include the required gdifonts submodule.

            Unzip it and place the `tTimers` folder in your Ashita `addons` directory, replacing any existing tTimers folder. In game, run `/addon reload tTimers`. You should see `BLU debug capture build v10 loaded.`

            ## What this build does
            - Includes the renderer stability fixes from PR #1.
            - Adds confirmed BLU debuff timers that are always active.
            - Adds experimental `~` BLU timers while `/tt bludebug` is running.
            - Writes timestamped capture logs to `config/addons/tTimers/logs/`.

            Capture logs include character name, level, INT, base Blue Magic skill, and equipped item IDs at cast time.
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}