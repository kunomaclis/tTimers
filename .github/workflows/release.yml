name: Release addon zip

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Stage release
        run: |
          set -euo pipefail

          mkdir -p "dist/tTimersBlu"
          
          rsync -a --delete \
            --exclude ".git" \
            --exclude ".gitmodules" \
            --exclude ".github" \
            --exclude "dist" \
            ./ "dist/tTimersBlu/"

          echo "Staged contents:"
          ls -la "dist/tTimersBlu"

      - name: Zip it
        run: |
          set -euo pipefail
          cd dist
          ZIP_NAME="tTimersBlu-${GITHUB_REF_NAME}.zip"
          zip -r "${ZIP_NAME}" "tTimersBlu"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Create/Update GitHub Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.ZIP_NAME }}
          body: |
            ## Install
            Download `tTimersBlu-${{ github.ref_name }}.zip` below. Do not use "Source code (zip)" because it does not include the required gdifonts submodule.

            Unzip it and place the `tTimersBlu` folder in your Ashita `addons` directory. In game, run `/addon load tTimersBlu`. You should see the tTimersBlu load banner.

            tTimersBlu is separate from the original tTimers addon and uses independent settings, so panels begin at their default positions. Both addons accept `/tt`; use `/ttblu` for tTimersBlu when both are loaded.

            ## What this build does
            - Includes the renderer stability fixes from PR #1.
            - Adds confirmed BLU debuff timers that are always active.
            - Adds experimental `~` BLU timers while `/ttblu bludebug` is running.
            - Writes timestamped capture logs to `config/addons/tTimersBlu/logs/`.

            Capture logs include character name, level, INT, base Blue Magic skill, and equipped item IDs at cast time.

            tTimersBlu is a HorizonXI-specific fork of [ThornyFFXI/tTimers](https://github.com/ThornyFFXI/tTimers), originally created by Thorny.
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}