name: Release addon zip

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Stage release
        run: |
          set -euo pipefail

          mkdir -p "dist/tTimersBlu"
          
          rsync -a --delete \
            --exclude ".git" \
            --exclude ".gitmodules" \
            --exclude ".github" \
            --exclude "dist" \
            ./ "dist/tTimersBlu/"

          echo "Staged contents:"
          ls -la "dist/tTimersBlu"

      - name: Zip it
        run: |
          set -euo pipefail
          cd dist
          ZIP_NAME="tTimersBlu-${GITHUB_REF_NAME}.zip"
          zip -r "${ZIP_NAME}" "tTimersBlu"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Create/Update GitHub Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.ZIP_NAME }}
          body: |
            ## Install
            Download `tTimersBlu-${{ github.ref_name }}.zip` below. Do not use "Source code (zip)" because it does not include the required gdifonts submodule.

            1. Unzip `tTimersBlu` into your Ashita `addons` folder.
            2. Optional: copy `config/addons/tTimers` and rename the copy `tTimersBlu` to keep your current settings.
            3. If tTimers starts automatically, check `scripts/default.txt` for `/addon load tTimers`. Remove that line if you do not want both addons loaded.
            4. In game, run `/addon load tTimersBlu`.

            Use `/ttblu` for tTimersBlu commands. Both addons also accept `/tt`.

            ## Blue Magic
            Confirmed timers are always active. Experimental `~` timers and logging are active only while `/ttblu bludebug` is running.

            Logs are saved to `config/addons/tTimersBlu/logs/` and include character name, level, INT, Blue Magic skill, and equipped item IDs.

            tTimersBlu is a HorizonXI-specific fork of [ThornyFFXI/tTimers](https://github.com/ThornyFFXI/tTimers), originally created by Thorny.
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}