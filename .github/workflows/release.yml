name: Release addon zip

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Stage release
        run: |
          set -euo pipefail

          mkdir -p "dist/tTimers"
          
          rsync -a --delete \
            --exclude ".git" \
            --exclude ".gitmodules" \
            --exclude ".github" \
            --exclude "dist" \
            ./ "dist/tTimers/"

          echo "Staged contents:"
          ls -la "dist/tTimers"

      - name: Zip it
        run: |
          set -euo pipefail
          cd dist
          ZIP_NAME="tTimers-${GITHUB_REF_NAME}.zip"
          zip -r "${ZIP_NAME}" "tTimers"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Create/Update GitHub Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.ZIP_NAME }}
          body: |
            ## Install
            Download `tTimers-${{ github.ref_name }}.zip` below. Do not use "Source code (zip)" because it does not include the required gdifonts submodule.

            1. Unzip `tTimers` into your Ashita `addons` folder, replacing any existing `tTimers` folder.
            2. In game, run `/addon reload tTimers`.

            Your existing tTimers settings carry over.

            ## Blue Magic
            Confirmed Blue Magic timers are always on. Estimated `~` timers for silent added effects are shown only with `/tt blumode`.

            This is a fork of [ThornyFFXI/tTimers](https://github.com/ThornyFFXI/tTimers), originally created by Thorny.
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}